# version: '3.8'

services:
  ground-station:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ground-station
    restart: unless-stopped
    ports:
      - "7070:7000"

    # Privileged is required to access USB SDR hardware directly
    privileged: true

    volumes:
      # Map backend source code for instant updates
      - ./backend:/app/backend
      # Map persistent database, recordings, and configuration directories
      - ./backend/data:/app/backend/data
      # Map host USB devices to the container for SDR hardware detection
      - /dev/bus/usb:/dev/bus/usb

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      - GS_ENVIRONMENT=production
      - TTNC_API_BASE_URL=http://192.168.55.40:4001
      # Connect to manual rigctld running on the host machine (Icom IC-9700 on port 4532 / COM3)
      - RIGCTLD_HOST=host.docker.internal
      - RIGCTLD_PORT=4532
      - ICOM_RIGCTLD_PORT_DEVICE=COM3
      - ICOM_AUDIO_PORT_DEVICE=COM4
      # Connect to Direwolf KISS TCP (8001) & AGWPE (8000) on host or direwolf container
      - DIREWOLF_KISS_HOST=host.docker.internal
      - DIREWOLF_KISS_PORT=8001
      - DIREWOLF_AGWPE_PORT=8000
      # Configure GNU Radio to use tmpfile-based circular buffers to avoid shared memory limit issues
      - GR_BUFFER_TYPE=vmcirc_mmap_tmpfile
      - PYTHONPATH=/app
      - STATIC_FILES_DIR=/app/frontend/dist
      - UHD_IMAGES_DIR=/app/backend/data/uhd_images
      - UHD_CONFIG_DIR=/app/backend/data/uhd_config

  # Optional modular Direwolf software TNC service for Icom IC-9700 USB Audio CODEC.
  # Can be started on demand via: docker compose --profile direwolf up -d
  # Or Direwolf can be run manually on the host machine listening on port 8001.
  # NOTE: rigctld (port 4532) is ALWAYS run manually on the host by the user.
  direwolf:
    image: ubuntu:noble-20250925
    container_name: ground-station-direwolf
    profiles:
      - direwolf
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8001:8001"
    devices:
      - /dev/snd:/dev/snd
    volumes:
      - ./direwolf.conf:/etc/direwolf/direwolf.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "apt-get update && apt-get install -y --no-install-recommends direwolf alsa-utils hamlib-utils &&
      exec direwolf -t 0 -c /etc/direwolf/direwolf.conf"
