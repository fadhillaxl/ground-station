###############################################################################
# Direwolf Configuration for Ground Station — Icom IC-9700 Satellite TNC
#
# Architecture Rules:
# - Transceiver: Icom IC-9700 (Hamlib model 3081)
# - rigctld is run MANUALLY on the host at TCP port 4532:
#     rigctld -m 3081 -r /dev/ttyUSB0 -s 115200 -T 0.0.0.0 -t 4532
# - Direwolf connects to that external rigctld over TCP (Hamlib model 2 = NET rigctl)
#   so there is zero serial port conflict (/dev/ttyUSB0 remains owned by rigctld).
###############################################################################

# -----------------------------------------------------------------------------
# 1. Audio Device Configuration (Icom IC-9700 USB Audio CODEC on Server)
# -----------------------------------------------------------------------------
# When Icom IC-9700 is plugged into the Server via USB:
# - Serial Port A (COM3 / /dev/ttyUSB0): Used by manual rigctld (-m 3081 -r COM3 -t 4532)
# - Serial Port B / Audio (COM4 / USB Audio CODEC): Used for Audio RX/TX
#
# On Linux with ALSA, IC-9700 enumerates as "USB Audio CODEC" (Burr-Brown TI):
ADEVICE plughw:CARD=CODEC,DEV=0
# On Windows Server (if running Direwolf natively on Windows with COM3/COM4):
# ADEVICE "USB Audio CODEC" "USB Audio CODEC"
ARATE 48000
ACHANNELS 2

# -----------------------------------------------------------------------------
# 2. Channel 0 — 1200 bps AFSK (VHF/UHF Packet, ISS, LAPAN-A2 / IO-86 APRS)
# -----------------------------------------------------------------------------
CHANNEL 0
MYCALL N0CALL-10
MODEM 1200

# PTT via Hamlib NET rigctl (Model 2) pointing to manual rigctld on port 4532.
# - Use host.docker.internal:4532 when Direwolf runs inside a Docker container.
# - Change to 127.0.0.1:4532 if running Direwolf directly on the host OS.
PTT RIG 2 host.docker.internal:4532

# -----------------------------------------------------------------------------
# 3. Channel 1 — 9600 bps FSK / GFSK (G3RUH / K9NG CubeSat Telemetry Downlink)
# -----------------------------------------------------------------------------
CHANNEL 1
MYCALL N0CALL-11
MODEM 9600

# Share external rigctld TCP endpoint for PTT control
PTT RIG 2 host.docker.internal:4532

# -----------------------------------------------------------------------------
# 4. Network TNC Servers (AGWPE & KISS TCP)
# -----------------------------------------------------------------------------
# AGWPE TCP Server port (for compatible client apps)
AGWPORT 8000

# KISS over TCP Server port (consumed by Ground Station Backend KISS Bridge)
KISSPORT 8001
